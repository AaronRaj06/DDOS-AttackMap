# Fly.io deployment. Change `app` if the name is taken, and pick the region nearest your viewers
# (`fly platform regions`). API keys are secrets, never set here: see README → Deploying.
app = "ddos-attackmap"
primary_region = "bom"

[build]
  [build.args]
    GEO = "1"

[env]
  # Fly's proxy is one hop in front of the app; rate limits need the real client IP
  TRUST_PROXY = "1"

[http_service]
  internal_port = 5050
  force_https = true
  # One machine that never sleeps: the event buffer, quota schedule and blacklist cache live in its process
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
